<h2 id="overview-title">Reah</h2><p class="overview-summary">Building the brand for one global account — from launch to $600M+ in transaction volume.</p>
<dl class="overview-facts"><div><dt>Role</dt><dd>Brand &amp; Visual Designer</dd></div><div><dt>Team</dt><dd>Reah in-house design</dd></div><div><dt>Scope</dt><dd>Identity, Motion, 3D, Product UI</dd></div></dl>
<div class="overview-columns"><div><h3>The challenge</h3><p>Global businesses juggle disconnected bank accounts, wallet apps, exchanges, spreadsheets and approval workflows. Reah needed a brand that makes banking and stablecoins feel like one trustworthy system — credible to finance teams, native to crypto teams.</p></div>
<div><h3>The solution</h3><p>We built the brand around one idea: many moving parts, one calm system. A restrained typographic core and a signature colour band give Reah the steadiness finance demands, while 3D forms and motion show money flowing between accounts, wallets and cards — complex underneath, simple on the surface.</p></div></div>
